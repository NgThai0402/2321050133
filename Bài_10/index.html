<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function tinhTuoi(namSinh) {
            var namHienTai = new Date().getFullYear();
            var tuoi = namHienTai - namSinh;
            return tuoi;
            
        }
    </script>
    Nhap năm sinh: <input type="number" id="namSinh"><br>
    <button onclick="document.getElementById('ketQua').value = tinhTuoi(parseInt(document.getElementById('namSinh').value))">Tính tuổi</button><br>
    Kết quả: <input type="text" id="ketQua">
</body>
</html>
