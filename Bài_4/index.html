<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 4</title>
</head>
<body>
    <h1>Form tạo thông tin</h1>
    <form>
        <div>
            <!-- input nếu không truyền type thì mặc định là text -->
            <p><b>Họ và Tên: </b></p><input type="text" name="Hvt">
        </div>
        <div>
            <p><b>Giới thiệu: </b></p>
            <textarea name="GioiThieu"></textarea>
        </div>
        <div>
            <p><b>Email: </b></p>
            <input type="email" name="Email">
        </div>
        <div>
            <p><b>Số điện thoại: </b></p>
            <input type="tel" 
            placeholder="Dạng số 0 x xxxx xxxx" 
            required
            pattern="[0]{1}[3,6,8,9]{1}[0-9]{8}">
        </div>
        <div>
            <p><b>Giới tính: </b></p>
            <input type="radio" name="GioiTinh" value="Nam">Nam<br>
            <input type="radio" name="GioiTinh" value="Nữ">Nữ
        </div>
        <div>
            <p><b>Sở thích: </b></p>
            Game: <input type="checkbox" name="SoThich" value="Game"><br>
            Music: <input type="checkbox" name="SoThich" value="Music"><br>
            Sport:<input type="checkbox" name="SoThich" value="Sport"><br>
        </div>
        <div>
            <p><b>Trình duyệt web hay sử dụng: </b></p>
            <input list="browsers">
            <datalist id="browsers">
                <option value="Internet Explorer">
                <option value="Firefox">
                <option value="Chrome">
                <option value="Opera">
            </datalist>
            <select name="browsers">
                <option value="Internet Explorer">Internet Explorer</option>
                <option value="Firefox">Firefox</option>
                <option value="Chrome">Chrome</option>
                <option value="Opera">Opera</option>
                <option value="Cốc cốc">Cốc Cốc</option>
                <option value="Safari">Safari</option>
            </select>
        </div>
        <div>
            <p><b>Anh yêu em bao nhiêu phần trăm</b></p>
            0 <input type="range" id="a" value="50">100 
        </div>
        <div>
            <input type="submit" value="Gửi">
            <button>Click</button>
            <input type="reset">
        </div>
        <div>
<iframe width="560" height="315" src="https://www.youtube.com/embed/wVLhvXB2flE?si=sR_0kdLyp77Rvr9r" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>    </form>
    <MARQUEE>
        <img width="300" height="300" src="/Ảnh/DoibongToiYeu.png">
    </MARQUEE>
    <video controls>
        <source src="/Ảnh/KyNiem.mp4" type="video/mp4">
    </video>

</html>
