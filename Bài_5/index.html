<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Bài 5</title>
    <style>
        h2 {
            color: red;
        }
        #khoa {
            color: ogrange;
        }
    </style>
</head>
<body>
    <!-- Kiểu 1 viết style trong thẻ -->
    <!-- Inline style -->
    <h1 style="color: blue;">HUMG</h1>
    <!-- Kiểu 2 viết ngoài thẻ -->
    <!-- Internal style -->
    <h2>Khoa Công Nghệ Thông Tin</h2>
    <!-- Kiểu 3 viết trong file css -->
    <!-- External style -->
    <h3>Ngành Tin Học Kinh Tế</h3>


    <!-- selector -->
    <!-- Cách 1: dùng tên thẻ -->


    <!-- Cách 2: dùng ID -->
    <h2 id="khoa">Khoa Công Nghệ Thông Tin</h2>

    <!-- Cách 3: dùng class -->
     <h2 id="khoa" class="khoa">Khoa Công Nghệ Thông Tin</h2>
     <h3 class="khoa">Ngành Tin Học Kinh Tế</h3>
</body>
</html>
