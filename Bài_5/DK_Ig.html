<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">

    <title>Đăng ký Instagram</title>

<body>
    <h1>Get started on Instagram</h1>

    <form>

        <div>
        </div>

                <option value="22">22</option>

                <option value="24">24</option>

        <div>
            <b>Name</b><br><input type="text" name="name" placeholder="Full name">
        </div>
        <div>
            <b>Username</b><br><input type="text" name="username" placeholder="Username">
        </div>
        <div>
            <input type="submit" value="Submit">
        </div>
        <div>
            <button>I already have an account</button>
        </div>
    </form>

</html>
