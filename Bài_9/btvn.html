<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function tinhDiem(){
            var a = parseFloat(document.getElementById('diemA').value);
            var b = parseFloat(document.getElementById('diemB').value);
            var c = parseFloat(document.getElementById('diemC').value);

            document.getElementById('ketQua').value = tinhDiemChu(a,b,c);
        }
        function tinhDiemChu(a,b,c){
            var tong= a*0.6 + b*0.3 + c*0.1;
            var kq = "";
            if (8 <=tong && tong <=10){
                kq = tong + " - " + "Điểm A";
            }
            else if (7<= tong && tong <8){
                kq = tong + " - " + "Điểm B";
            }
            else if (5<= tong && tong <7){
                kq = tong + " - " + "Điểm C";
            }
            else if (4<= tong && tong <5){
                kq = tong + " - " + "Điểm D";
            }
            else if(0<= tong && tong <4){
                kq = tong + " - " + "Điểm F";
            }
            else{
                kq = "Lỗi";
            }
            return kq;
        }
    </script>

    <div>
        Nhập điểm A: <input type="number" id="diemA"><br>
        Nhập điểm B: <input type="number" id="diemB"><br>
        Nhập điểm C: <input type="number" id="diemC"><br>
        <button onclick="tinhDiem()">Tính Điểm</button>
    </div>
    <div>
        Kết quả: <input type="text" id="ketQua"><br>
    </div>
</body>
</html>
